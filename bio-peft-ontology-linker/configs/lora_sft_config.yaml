experiment:
  name: bio_lora_ontology_sft_v1
  seed: 42
  output_dir: outputs/bio_lora_sft_v1

model:
  base_model_name: Qwen/Qwen2.5-3B-Instruct   # or BioMistral/BioMistral-7B / meta-llama/Llama-3.1-8B-Instruct
  use_4bit_qlora: true
  bnb_4bit_quant_type: nf4
  bnb_4bit_compute_dtype: bfloat16
  use_double_quant: true

lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  bias: none
  task_type: CAUSAL_LM
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

data:
  train_jsonl: data/train_sft_bio_ner.jsonl
  validation_split: 0.2
  max_seq_length: 1024

training:
  num_train_epochs: 3
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 4
  learning_rate: 2.0e-4
  lr_scheduler_type: cosine
  warmup_ratio: 0.05
  weight_decay: 0.01
  bf16: true
  gradient_checkpointing: true
  logging_steps: 10
  eval_strategy: epoch
  save_strategy: epoch
