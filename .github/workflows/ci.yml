name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-and-benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run unit tests
        run: PYTHONPATH=src pytest -v
      - name: Validate LoRA config and dataset schema
        run: PYTHONPATH=src python3 -m bio_peft.train_lora --config configs/lora_sft_config.yaml --dry-run
      - name: Run ontology normalization benchmark
        run: python3 src/bio_peft/benchmark_strategies.py
